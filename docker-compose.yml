version: '3.8'

services:
  nudenet:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./models:/app/models
    environment:
      - NODE_ENV=production
      - MIN_SCORE=0.38
      - BLUR_RADIUS=25
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
